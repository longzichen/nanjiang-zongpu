name: 宗谱纠错审核与邮件全自动闭环

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  # 1. 收到新 Issue 时：AI 自动初审并在评论区生成报告 + 发送邮件提醒管理员
  ai_precheck_and_notify_admin:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 运行 AI 初审并生成分析报告
        id: run_ai
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python -c "
          import sys, os
          sys.path.append('scripts')
          from ai_reviewer import generate_ai_precheck_report
          
          issue_body = os.environ.get('ISSUE_BODY', '')
          report = generate_ai_precheck_report(issue_body)
          with open('ai_report.txt', 'w', encoding='utf-8') as f:
              f.write(report)
          "

      - name: AI 在 GitHub Issue 评论区发表初审报告
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('ai_report.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });

      - name: 发送提醒邮件给管理员 (含 AI 初审建议)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: 465
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          python -c "
          import sys, os
          sys.path.append('scripts')
          from genealogy_mailer import send_admin_alert
          from apply_correction import parse_issue_body
          
          issue_body = os.environ.get('ISSUE_BODY', '')
          parsed = parse_issue_body(issue_body)
          parsed['title'] = os.environ.get('ISSUE_TITLE', '新纠错申请')
          parsed['issueUrl'] = os.environ.get('ISSUE_URL', '')
          
          send_admin_alert(parsed)
          "

  # 2. 管理员在评论区回复 /approve 时：自动合入数据、重新编译发布、发邮件给用户
  auto_merge_and_reply:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: pip install python-docx

      - name: 自动合入数据并重新编译
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: 465
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/apply_correction.py

      - name: 提交并推送到仓库主分支 (自动触发 Pages 更新)
        run: |
          git config --global user.name "Genealogy-Bot"
          git config --global user.email "bot@nanjiang.org"
          git add -A
          git commit -m "auto: 自动合入宗谱修改工单 #${{ github.event.issue.number }}" || echo "No changes"
          git push

      - name: 自动关闭 Issue 并回复状态
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🎉 **审核已通过**！宗谱数据已由 AI 自动合入并重新编译发布，最新版本已通过邮件发送给提交者。'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
